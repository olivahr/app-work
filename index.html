<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TimeTrack Pro - Registro de Horas</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f172a; --surface: #1e293b; --surface-light: #334155;
            --text: #f1f5f9; --text-secondary: #94a3b8; --border: #334155;
            --success: #10b981; --success-glow: rgba(16,185,129,0.3);
            --danger: #ef4444; --danger-glow: rgba(239,68,68,0.3);
            --primary: #3b82f6; --primary-glow: rgba(59,130,246,0.3);
            --warning: #f59e0b;
            --shadow: 0 4px 20px rgba(0,0,0,0.4);
            --radius: 16px; --radius-sm: 10px;
        }
        html { font-size: 16px; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg); color: var(--text); min-height: 100vh;
            line-height: 1.5; overflow-x: hidden; -webkit-font-smoothing: antialiased;
        }
        .app { max-width: 420px; margin: 0 auto; min-height: 100vh; display: flex; flex-direction: column; }

        /* Header */
        .header {
            padding: 16px 20px; display: flex; align-items: center; justify-content: space-between;
            border-bottom: 1px solid var(--border);
        }
        .logo { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.1rem; }
        .logo-icon { width: 36px; height: 36px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .status-pill {
            display: flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px;
            font-size: 0.78rem; font-weight: 600; transition: all 0.3s;
        }
        .status-pill.on { background: rgba(16,185,129,0.15); color: var(--success); border: 1px solid rgba(16,185,129,0.3); }
        .status-pill.off { background: rgba(239,68,68,0.15); color: var(--danger); border: 1px solid rgba(239,68,68,0.3); }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; }
        .status-pill.on .status-dot { background: var(--success); animation: pulse 2s infinite; }
        .status-pill.off .status-dot { background: var(--danger); }
        @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(1.3)} }

        /* Views */
        .view { display: none; flex-direction: column; flex: 1; padding: 16px; gap: 14px; animation: fadeIn 0.3s ease; }
        .view.active { display: flex; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

        /* Bottom Nav */
        .bottom-nav {
            display: flex; background: var(--surface); border-top: 1px solid var(--border);
            padding: 6px 0 10px; position: sticky; bottom: 0; z-index: 100;
        }
        .nav-item {
            flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
            padding: 6px; border: none; background: none; color: var(--text-secondary);
            font-family: inherit; font-size: 0.7rem; font-weight: 500; cursor: pointer; transition: 0.2s;
        }
        .nav-item.active { color: var(--primary); }
        .nav-item .nav-icon { font-size: 1.4rem; }

        /* Cards */
        .card {
            background: var(--surface); border-radius: var(--radius); padding: 20px;
            border: 1px solid var(--border); box-shadow: var(--shadow);
        }
        .card-title { font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; }

        /* Clock View */
        .clock-display { text-align: center; padding: 10px 0 20px; }
        .clock-time { font-size: 3.2rem; font-weight: 700; letter-spacing: -1px; font-variant-numeric: tabular-nums; line-height: 1; }
        .clock-date { font-size: 0.9rem; color: var(--text-secondary); margin-top: 6px; text-transform: capitalize; }
        .timer-display {
            font-size: 2.4rem; font-weight: 800; color: var(--success); font-variant-numeric: tabular-nums;
            text-align: center; padding: 16px; background: rgba(16,185,129,0.08); border-radius: var(--radius-sm);
            border: 1px solid rgba(16,185,129,0.2); margin-bottom: 16px; letter-spacing: 2px;
        }
        .timer-display.stopped { color: var(--text-secondary); border-color: var(--border); background: transparent; }
        .timer-label { font-size: 0.75rem; color: var(--text-secondary); text-align: center; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 1px; }

        .btn-main {
            width: 100%; padding: 18px; border: none; border-radius: var(--radius-sm);
            font-family: inherit; font-size: 1rem; font-weight: 700; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 10px;
            position: relative; overflow: hidden;
        }
        .btn-main:active { transform: scale(0.97); }
        .btn-in {
            background: var(--success); color: white;
            box-shadow: 0 4px 20px var(--success-glow);
        }
        .btn-in:hover { background: #059669; }
        .btn-out {
            background: var(--danger); color: white;
            box-shadow: 0 4px 20px var(--danger-glow);
        }
        .btn-out:hover { background: #dc2626; }
        .btn-main:disabled { opacity: 0.4; cursor: not-allowed; transform: none !important; box-shadow: none; }

        .session-detail {
            display: flex; justify-content: space-between; padding: 12px 0;
            border-bottom: 1px solid var(--border); font-size: 0.85rem;
        }
        .session-detail:last-child { border-bottom: none; }
        .session-detail-label { color: var(--text-secondary); }
        .session-detail-value { font-weight: 600; font-variant-numeric: tabular-nums; }

        /* History View */
        .week-group { margin-bottom: 16px; }
        .week-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 14px; background: var(--surface-light); border-radius: var(--radius-sm);
            margin-bottom: 10px; font-size: 0.8rem;
        }
        .week-header-title { font-weight: 700; }
        .week-header-total { color: var(--primary); font-weight: 700; }

        .day-card {
            background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
            margin-bottom: 8px; overflow: hidden;
        }
        .day-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 12px 14px; cursor: pointer; transition: 0.2s;
        }
        .day-header:hover { background: var(--surface-light); }
        .day-info { display: flex; align-items: center; gap: 12px; }
        .day-badge {
            width: 40px; height: 40px; border-radius: 10px; display: flex; flex-direction: column;
            align-items: center; justify-content: center; background: var(--surface-light); font-weight: 700;
        }
        .day-badge-num { font-size: 1rem; line-height: 1; }
        .day-badge-name { font-size: 0.6rem; text-transform: uppercase; color: var(--text-secondary); }
        .day-title { font-weight: 600; font-size: 0.9rem; }
        .day-subtitle { font-size: 0.75rem; color: var(--text-secondary); }
        .day-total { font-weight: 700; color: var(--success); font-variant-numeric: tabular-nums; font-size: 0.95rem; }
        .day-sessions { display: none; padding: 0 14px 14px; }
        .day-sessions.open { display: block; animation: slideDown 0.25s ease; }
        @keyframes slideDown { from{opacity:0;max-height:0} to{opacity:1;max-height:500px} }

        .session-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem;
        }
        .session-row:last-child { border-bottom: none; }
        .session-times { display: flex; align-items: center; gap: 8px; color: var(--text-secondary); }
        .session-times .arrow { color: var(--primary); }
        .session-dur { font-weight: 700; color: var(--text); font-variant-numeric: tabular-nums; }

        .empty-state { text-align: center; padding: 50px 20px; color: var(--text-secondary); }
        .empty-state-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }

        /* Report View */
        .report-textarea {
            width: 100%; min-height: 280px; background: var(--bg); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 16px; color: var(--text); font-family: inherit;
            font-size: 0.9rem; line-height: 1.7; resize: none; outline: none;
        }
        .report-textarea:focus { border-color: var(--primary); }
        .input-phone {
            width: 100%; padding: 14px; background: var(--bg); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text); font-family: inherit; font-size: 0.95rem;
            outline: none; margin-bottom: 10px;
        }
        .input-phone:focus { border-color: var(--primary); }
        .input-phone::placeholder { color: var(--text-secondary); }
        .btn-whatsapp {
            width: 100%; padding: 16px; background: #25d366; color: white; border: none;
            border-radius: var(--radius-sm); font-family: inherit; font-size: 1rem; font-weight: 700;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: 0.2s;
        }
        .btn-whatsapp:hover { background: #128c7e; }
        .btn-whatsapp:active { transform: scale(0.97); }
        .btn-secondary {
            width: 100%; padding: 14px; background: transparent; color: var(--text-secondary);
            border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-family: inherit;
            font-size: 0.9rem; font-weight: 600; cursor: pointer; transition: 0.2s; margin-top: 8px;
        }
        .btn-secondary:hover { border-color: var(--danger); color: var(--danger); }

        /* Toast */
        .toast-container {
            position: fixed; top: 16px; left: 50%; transform: translateX(-50%); z-index: 1000;
            display: flex; flex-direction: column; gap: 8px; pointer-events: none; width: 90%; max-width: 380px;
        }
        .toast {
            padding: 14px 18px; border-radius: var(--radius-sm); color: white; font-size: 0.88rem;
            font-weight: 500; box-shadow: var(--shadow); display: flex; align-items: center; gap: 10px;
            animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards; pointer-events: auto;
        }
        .toast.ok { background: var(--success); }
        .toast.err { background: var(--danger); }
        .toast.info { background: var(--primary); }
        @keyframes toastIn { from{opacity:0;transform:translateY(-16px)} to{opacity:1;transform:translateY(0)} }
        @keyframes toastOut { from{opacity:1;transform:translateY(0)} to{opacity:0;transform:translateY(-16px)} }

        /* Modal */
        .modal-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex;
            align-items: center; justify-content: center; z-index: 2000; opacity: 0;
            visibility: hidden; transition: 0.2s; padding: 20px;
        }
        .modal-bg.show { opacity: 1; visibility: visible; }
        .modal-box {
            background: var(--surface); border-radius: var(--radius); padding: 24px;
            width: 100%; max-width: 340px; border: 1px solid var(--border); transform: scale(0.92);
            transition: 0.2s;
        }
        .modal-bg.show .modal-box { transform: scale(1); }
        .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 8px; }
        .modal-text { font-size: 0.88rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
        .modal-actions { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 12px; border: none; border-radius: var(--radius-sm); font-family: inherit; font-size: 0.88rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .modal-btn-cancel { background: var(--surface-light); color: var(--text); }
        .modal-btn-ok { background: var(--danger); color: white; }
        .modal-btn:hover { opacity: 0.9; }
    </style>
<base target="_blank">
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <div class="logo-icon">⏱️</div>
                <span>TimeTrack Pro</span>
            </div>
            <div id="statusPill" class="status-pill off">
                <span class="status-dot"></span>
                <span id="statusText">Fuera</span>
            </div>
        </div>

        <!-- VIEW: CLOCK (Registro) -->
        <div id="viewClock" class="view active">
            <div class="card">
                <div class="clock-display">
                    <div class="clock-time" id="clockTime">00:00:00</div>
                    <div class="clock-date" id="clockDate">Cargando...</div>
                </div>
                <div class="timer-label">Tiempo de sesión</div>
                <div class="timer-display stopped" id="timerDisplay">00:00:00</div>
                <button id="btnIn" class="btn-main btn-in" onclick="doClockIn()">▶️ Iniciar Jornada</button>
                <button id="btnOut" class="btn-main btn-out" onclick="doClockOut()" style="display:none;">⏹️ Finalizar Jornada</button>
            </div>
            <div class="card">
                <div class="card-title">Detalle de hoy</div>
                <div class="session-detail">
                    <span class="session-detail-label">Entrada</span>
                    <span class="session-detail-value" id="detailIn">--:--</span>
                </div>
                <div class="session-detail">
                    <span class="session-detail-label">Salida</span>
                    <span class="session-detail-value" id="detailOut">--:--</span>
                </div>
                <div class="session-detail">
                    <span class="session-detail-label">Total del día</span>
                    <span class="session-detail-value" id="detailTotal" style="color:var(--success)">0h 0m</span>
                </div>
            </div>
        </div>

        <!-- VIEW: HISTORY -->
        <div id="viewHistory" class="view">
            <div id="historyContent">
                <div class="empty-state">
                    <div class="empty-state-icon">📭</div>
                    <div>No hay registros aún</div>
                </div>
            </div>
        </div>

        <!-- VIEW: REPORT -->
        <div id="viewReport" class="view">
            <div class="card">
                <div class="card-title">Reporte Semanal</div>
                <textarea class="report-textarea" id="reportText" readonly></textarea>
            </div>
            <div class="card">
                <div class="card-title">Enviar por WhatsApp</div>
                <input type="tel" class="input-phone" id="phoneInput" placeholder="+1 502 398 1640" value="+1 502 398 1640">
                <button class="btn-whatsapp" onclick="sendReport()">💬 Enviar por WhatsApp</button>
                <button class="btn-secondary" onclick="confirmReset()">🗑️ Borrar todos los datos</button>
            </div>
        </div>

        <!-- Bottom Nav -->
        <div class="bottom-nav">
            <button class="nav-item active" onclick="switchView('clock')" data-view="clock">
                <span class="nav-icon">⏱️</span>
                <span>Reloj</span>
            </button>
            <button class="nav-item" onclick="switchView('history')" data-view="history">
                <span class="nav-icon">📋</span>
                <span>Historial</span>
            </button>
            <button class="nav-item" onclick="switchView('report')" data-view="report">
                <span class="nav-icon">📊</span>
                <span>Reporte</span>
            </button>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container" id="toasts"></div>

    <!-- Modal -->
    <div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
        <div class="modal-box">
            <div class="modal-title" id="modalTitle">¿Borrar todo?</div>
            <div class="modal-text" id="modalText">Esta acción no se puede deshacer.</div>
            <div class="modal-actions">
                <button class="modal-btn modal-btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="modal-btn modal-btn-ok" id="modalOk">Borrar</button>
            </div>
        </div>
    </div>

    <script>
        // =========================
        // STATE
        // =========================
        const K_RECORDS = 'tt_records';
        const K_SESSION = 'tt_session';
        let records = [];
        let activeSession = null;
        let tick = null;

        // =========================
        // INIT
        // =========================
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
            startClock();
            renderAll();
        });

        // =========================
        // STORAGE
        // =========================
        function loadData() {
            try {
                const r = localStorage.getItem(K_RECORDS);
                const s = localStorage.getItem(K_SESSION);
                if (r) records = JSON.parse(r);
                if (s) {
                    const sess = JSON.parse(s);
                    // Solo recuperar si es del mismo día
                    const sessDay = new Date(sess.date).toDateString();
                    const today = new Date().toDateString();
                    if (sessDay === today) {
                        activeSession = sess;
                    } else {
                        // Sesión vieja — guardar como incompleta si tiene entrada
                        if (sess.clockIn) {
                            records.push({
                                id: genId(), date: sess.date, clockIn: sess.clockIn,
                                clockOut: null, duration: null, completed: false
                            });
                            saveRecords();
                        }
                        localStorage.removeItem(K_SESSION);
                    }
                }
            } catch (e) { records = []; activeSession = null; }
        }
        function saveRecords() { localStorage.setItem(K_RECORDS, JSON.stringify(records)); }
        function saveSession() {
            if (activeSession) localStorage.setItem(K_SESSION, JSON.stringify(activeSession));
            else localStorage.removeItem(K_SESSION);
        }

        // =========================
        // CLOCK IN
        // =========================
        function doClockIn() {
            if (activeSession) { toast('Ya hay una sesión activa', 'err'); return; }
            const now = new Date();
            activeSession = { id: genId(), date: now.toISOString(), clockIn: now.toISOString(), clockOut: null };
            saveSession();
            renderAll();
            toast('✅ Sesión iniciada: ' + fmtTime(now), 'ok');
        }

        // =========================
        // CLOCK OUT
        // =========================
        function doClockOut() {
            if (!activeSession) { toast('No hay sesión activa', 'err'); return; }
            const now = new Date();
            const start = new Date(activeSession.clockIn);
            const dur = now - start;
            if (dur < 60000) { toast('Mínimo 1 minuto', 'err'); return; }

            records.unshift({
                id: activeSession.id, date: activeSession.date,
                clockIn: activeSession.clockIn, clockOut: now.toISOString(),
                duration: dur, completed: true
            });
            activeSession = null;
            saveRecords(); saveSession();
            renderAll();
            toast('✅ Sesión guardada', 'ok');
        }

        // =========================
        // RENDER
        // =========================
        function renderAll() {
            renderStatus();
            renderClockView();
            renderHistory();
            renderReport();
        }

        function renderStatus() {
            const pill = document.getElementById('statusPill');
            const txt = document.getElementById('statusText');
            if (activeSession) {
                pill.className = 'status-pill on';
                txt.textContent = 'Trabajando';
            } else {
                pill.className = 'status-pill off';
                txt.textContent = 'Fuera';
            }
        }

        function renderClockView() {
            const btnIn = document.getElementById('btnIn');
            const btnOut = document.getElementById('btnOut');
            const timer = document.getElementById('timerDisplay');
            const detailIn = document.getElementById('detailIn');
            const detailOut = document.getElementById('detailOut');
            const detailTotal = document.getElementById('detailTotal');

            // Botones
            if (activeSession) {
                btnIn.style.display = 'none';
                btnOut.style.display = 'flex';
                timer.classList.remove('stopped');
            } else {
                btnIn.style.display = 'flex';
                btnOut.style.display = 'none';
                timer.classList.add('stopped');
                timer.textContent = '00:00:00';
            }

            // Detalle de hoy
            const today = new Date().toDateString();
            const todayRecords = records.filter(r => new Date(r.date).toDateString() === today && r.completed);
            const todayTotal = todayRecords.reduce((sum, r) => sum + r.duration, 0);

            if (activeSession) {
                detailIn.textContent = fmtTime(new Date(activeSession.clockIn));
                detailOut.textContent = '--:--';
                const elapsed = new Date() - new Date(activeSession.clockIn);
                detailTotal.textContent = fmtDur(todayTotal + elapsed);
            } else if (todayRecords.length > 0) {
                const last = todayRecords[0];
                detailIn.textContent = fmtTime(new Date(last.clockIn));
                detailOut.textContent = fmtTime(new Date(last.clockOut));
                detailTotal.textContent = fmtDur(todayTotal);
            } else {
                detailIn.textContent = '--:--';
                detailOut.textContent = '--:--';
                detailTotal.textContent = '0h 0m';
            }
        }

        // =========================
        // TIMER LOOP
        // =========================
        function startClock() {
            updateClock();
            tick = setInterval(updateClock, 1000);
        }
        function updateClock() {
            const now = new Date();
            document.getElementById('clockTime').textContent = now.toLocaleTimeString('es-ES', { hour12: true });
            document.getElementById('clockDate').textContent = now.toLocaleDateString('es-ES', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });

            if (activeSession) {
                const elapsed = now - new Date(activeSession.clockIn);
                document.getElementById('timerDisplay').textContent = fmtDurFull(elapsed);
                // Actualizar total del día en vivo
                const today = now.toDateString();
                const todayRecords = records.filter(r => new Date(r.date).toDateString() === today && r.completed);
                const todayTotal = todayRecords.reduce((sum, r) => sum + r.duration, 0);
                document.getElementById('detailTotal').textContent = fmtDur(todayTotal + elapsed);
            }
        }

        // =========================
        // HISTORY (Grouped by week → day → sessions)
        // =========================
        function renderHistory() {
            const container = document.getElementById('historyContent');
            if (records.length === 0 && !activeSession) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📭</div>
                        <div>No hay registros aún</div>
                    </div>`;
                return;
            }

            // Agrupar por semana
            const weeks = {};
            const all = [...records];
            if (activeSession) {
                all.unshift({ ...activeSession, duration: null, completed: false });
            }

            all.forEach(rec => {
                const d = new Date(rec.date);
                const ws = weekStart(d);
                const key = ws.toISOString();
                if (!weeks[key]) weeks[key] = { start: ws, days: {} };
                const dayKey = d.toDateString();
                if (!weeks[key].days[dayKey]) weeks[key].days[dayKey] = { date: d, sessions: [] };
                weeks[key].days[dayKey].sessions.push(rec);
            });

            // Render
            let html = '';
            const weekKeys = Object.keys(weeks).sort((a, b) => new Date(b) - new Date(a));

            weekKeys.forEach(wk => {
                const week = weeks[wk];
                const weekEnd = new Date(week.start);
                weekEnd.setDate(weekEnd.getDate() + 6);
                const weekTotal = Object.values(week.days).reduce((sum, day) => {
                    return sum + day.sessions.reduce((s, sess) => s + (sess.duration || 0), 0);
                }, 0);

                html += `
                    <div class="week-group">
                        <div class="week-header">
                            <span class="week-header-title">Semana ${fmtShortDate(week.start)} - ${fmtShortDate(weekEnd)}</span>
                            <span class="week-header-total">${fmtDur(weekTotal)}</span>
                        </div>
                `;

                const dayKeys = Object.keys(week.days).sort((a, b) => new Date(b) - new Date(a));
                dayKeys.forEach(dk => {
                    const day = week.days[dk];
                    const dayTotal = day.sessions.reduce((s, sess) => s + (sess.duration || 0), 0);
                    const isToday = dk === new Date().toDateString();
                    const dayId = 'day_' + dk.replace(/\s/g, '_');

                    html += `
                        <div class="day-card">
                            <div class="day-header" onclick="toggleDay('${dayId}')">
                                <div class="day-info">
                                    <div class="day-badge" style="${isToday ? 'background:rgba(245,158,11,0.2);color:var(--warning)' : ''}">
                                        <div class="day-badge-num">${day.date.getDate()}</div>
                                        <div class="day-badge-name">${day.date.toLocaleDateString('es-ES',{weekday:'short'})}</div>
                                    </div>
                                    <div>
                                        <div class="day-title">${day.date.toLocaleDateString('es-ES',{weekday:'long'})}</div>
                                        <div class="day-subtitle">${day.sessions.length} sesión${day.sessions.length>1?'es':''}</div>
                                    </div>
                                </div>
                                <div class="day-total">${fmtDur(dayTotal)}</div>
                            </div>
                            <div class="day-sessions" id="${dayId}">
                    `;

                    day.sessions.forEach(sess => {
                        const inTime = fmtTime(new Date(sess.clockIn));
                        const outTime = sess.clockOut ? fmtTime(new Date(sess.clockOut)) : 'En curso';
                        const dur = sess.duration ? fmtDur(sess.duration) : fmtDur(new Date() - new Date(sess.clockIn));
                        html += `
                            <div class="session-row">
                                <div class="session-times">
                                    <span>${inTime}</span>
                                    <span class="arrow">→</span>
                                    <span>${outTime}</span>
                                </div>
                                <div class="session-dur">${dur}</div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                });

                html += `</div>`;
            });

            container.innerHTML = html;
        }

        function toggleDay(id) {
            const el = document.getElementById(id);
            el.classList.toggle('open');
        }

        // =========================
        // REPORT
        // =========================
        function renderReport() {
            const now = new Date();
            const ws = weekStart(now);
            const we = new Date(ws); we.setDate(we.getDate() + 6);

            let text = `📊 RESUMEN SEMANAL
`;
            text += `📅 ${fmtLongDate(ws)} - ${fmtLongDate(we)}
`;
            text += `━━━━━━━━━━━━━━━━━━━━━━

`;

            const dayNames = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
            const dayHours = new Array(7).fill(0);
            let total = 0;

            records.forEach(r => {
                if (!r.completed) return;
                const d = new Date(r.date);
                if (weekStart(d).getTime() === ws.getTime()) {
                    dayHours[d.getDay()] += r.duration;
                    total += r.duration;
                }
            });

            if (activeSession) {
                const d = new Date(activeSession.date);
                if (weekStart(d).getTime() === ws.getTime()) {
                    const elapsed = new Date() - new Date(activeSession.clockIn);
                    dayHours[d.getDay()] += elapsed;
                    total += elapsed;
                }
            }

            for (let i = 1; i <= 7; i++) {
                const idx = i % 7;
                const h = dayHours[idx];
                text += `• ${dayNames[idx]}: ${h > 0 ? fmtDur(h) : 'Sin registro'}
`;
            }

            text += `
━━━━━━━━━━━━━━━━━━━━━━
`;
            text += `⏱️ TOTAL SEMANAL: ${fmtDur(total)}
`;
            text += `📱 TimeTrack Pro`;

            document.getElementById('reportText').value = text;
        }

        function sendReport() {
            const phone = document.getElementById('phoneInput').value.replace(/[^\d+]/g, '');
            if (!phone.startsWith('+')) { toast('Incluye código de país (ej: +1)', 'err'); return; }
            const msg = encodeURIComponent(document.getElementById('reportText').value);
            window.open(`https://wa.me/${phone}?text=${msg}`, '_blank');
            toast('Abriendo WhatsApp...', 'ok');
        }

        // =========================
        // RESET
        // =========================
        function confirmReset() {
            showModal('Borrar todos los datos', '¿Seguro? No se puede deshacer.', () => {
                records = []; activeSession = null;
                saveRecords(); saveSession(); renderAll();
                toast('Datos eliminados', 'info'); closeModal();
            });
        }

        // =========================
        // NAVIGATION
        // =========================
        function switchView(name) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('view' + name.charAt(0).toUpperCase() + name.slice(1)).classList.add('active');
            document.querySelector(`.nav-item[data-view="${name}"]`).classList.add('active');
            if (name === 'report') renderReport();
            if (name === 'history') renderHistory();
        }

        // =========================
        // UTILS
        // =========================
        function weekStart(d) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            const ws = new Date(date.setDate(diff));
            ws.setHours(0,0,0,0);
            return ws;
        }
        function fmtTime(d) {
            return d.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', hour12: true });
        }
        function fmtDur(ms) {
            const s = Math.floor(ms / 1000);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            if (h === 0) return `${m}m`;
            return `${h}h ${m}m`;
        }
        function fmtDurFull(ms) {
            const s = Math.floor(ms / 1000);
            const h = Math.floor(s / 3600);
            const m = Math.floor((s % 3600) / 60);
            const sec = s % 60;
            return `${pad(h)}:${pad(m)}:${pad(sec)}`;
        }
        function fmtShortDate(d) {
            return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit' });
        }
        function fmtLongDate(d) {
            return d.toLocaleDateString('es-ES', { day: '2-digit', month: 'long' });
        }
        function pad(n) { return String(n).padStart(2, '0'); }
        function genId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

        // =========================
        // TOAST & MODAL
        // =========================
        function toast(msg, type) {
            const c = document.getElementById('toasts');
            const t = document.createElement('div');
            t.className = 'toast ' + (type === 'ok' ? 'ok' : type === 'err' ? 'err' : 'info');
            const icon = type === 'ok' ? '✅' : type === 'err' ? '❌' : 'ℹ️';
            t.innerHTML = `<span>${icon}</span><span>${msg}</span>`;
            c.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }
        function showModal(title, text, onOk) {
            document.getElementById('modalTitle').textContent = title;
            document.getElementById('modalText').textContent = text;
            document.getElementById('modalOk').onclick = onOk;
            document.getElementById('modal').classList.add('show');
        }
        function closeModal() { document.getElementById('modal').classList.remove('show'); }
    </script>
</body>
</html>
